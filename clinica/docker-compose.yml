# Produção na VPS: app + PostgreSQL + Caddy (HTTPS automático, obrigatório para PWA) + backup diário
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinica
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinica"]
      interval: 10s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://clinica:${DB_PASSWORD}@db:5432/clinica
      PUBLIC_URL: https://${DOMINIO}
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]

  # Backup diário do banco em ./backups (mantém os últimos 30 dias)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U clinica clinica | gzip > /backups/clinica-$$(date +%F).sql.gz;
        find /backups -name "clinica-*.sql.gz" -mtime +30 -delete;
        sleep 86400; done'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
